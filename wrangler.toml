name = "stocks-worker"
main = "src/index.js"
compatibility_date = "2026-04-28"
compatibility_flags = ["nodejs_compat"]

# Pin to the sevendwarfs Cloudflare account. The default wrangler auth
# on this machine resolves to the umbrella account (frank@umbrellaautomation.com),
# which would silently deploy to the wrong tenant. Pinning here makes
# wrangler fail loudly with a clear "wrong account" error if the env
# token isn't scoped to sevendwarfs. Run `cf sevendwarfs` (PowerShell
# profile helper) before `npx wrangler deploy`.
account_id = "fe16eca597b8d5afa20dfe7b2550640b"

# Two cron triggers:
#   "0 14 * * *"   — Daily dividend reminders at 14:00 UTC (9am US Eastern,
#                    10am during EDT). Same since worker v0.3.0.
#   "0 12 1 * *"   — Monthly digest of upcoming payouts, on the 1st of each
#                    month at 12:00 UTC (7am US Eastern, 8am during EDT).
#                    Added in worker v0.7.0. The scheduled() handler in
#                    src/index.js dispatches by event.cron.
[triggers]
crons = ["0 14 * * *", "0 12 1 * *"]

# Firebase project ID is not a secret — it's already in the public stocks index.html
# Used by the Worker to verify Firebase ID tokens issued to your users.
[vars]
FIREBASE_PROJECT_ID = "stockfolio-96c95"

# Single-user (Path B) email-reminder configuration. UID is public-equivalent
# (same as a Firebase auth subject). Sender domain must be verified in Resend.
OWNER_UID = "OVMDPgJd4LP0Uts1klAQrV8Zoqb2"
SENDER_FROM = "Stockfolio Reminders <noreply@stocks.bookhockeys.com>"

# CORS allowed origins (comma-separated). Add hostnames here as deploy targets change.
# Workers don't have a built-in env array type, so this is a comma-separated string.
ALLOWED_ORIGINS = "https://itsavibecode.github.io,http://localhost:8092,http://127.0.0.1:8092"

# Secrets are set via `wrangler secret put` and never live in this file or in source:
#   wrangler secret put SNAPTRADE_CLIENT_ID
#   wrangler secret put SNAPTRADE_CONSUMER_KEY
#   wrangler secret put FIREBASE_SERVICE_ACCOUNT_JSON   # JSON of service account, used for Firestore admin + Identity Toolkit lookups
#   wrangler secret put RESEND_API_KEY                  # Resend API key for sending dividend reminders
